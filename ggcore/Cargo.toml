[package]
name = "ggcore"
version = "0.1.0"
edition = "2021"

[lib]
name = "ggcore"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29" }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
boa_engine = "0.19"
winit = "0.30"
softbuffer = "0.4"
regex = "1"

# cargo test는 --no-default-features로 실행 (extension-module은
# 파이썬 심볼을 링크하지 않아 테스트 바이너리를 만들 수 없다)
[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = true
codegen-units = 1

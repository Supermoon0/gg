<html><head><style>
body { margin: 0; font-family: sans-serif; }
.item { width: 600px; border-width: 1px; border-color: #dddddd;
        padding: 10px; margin-bottom: 12px; }
.thumb { float: left; width: 120px; height: 90px;
         background-color: #b0c4de; }
.item h3 { margin: 0 0 6px 0; font-size: 19px; }
.item p { margin: 0; color: #555555; line-height: 1.5; }
.meta { clear: both; color: #999999; font-size: 13px; }
</style></head><body>
<div class="item">
  <div class="thumb"></div>
  <h3>뉴스 헤드라인 하나</h3>
  <p>본문 요약 텍스트가 썸네일 오른쪽으로 흐릅니다. wrapping text
     beside a floated thumbnail box, the classic news pattern.</p>
  <div class="meta">2026-07-18 · 연합뉴스</div>
</div>
<div class="item">
  <div class="thumb" style="float:right"></div>
  <h3>Second headline</h3>
  <p>Right-floated variant with the summary hugging the left side.</p>
  <div class="meta">meta line under cleared floats</div>
</div>
</body></html>

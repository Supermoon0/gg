name: wheels

# Build ready-to-install ggcore wheels (Windows / Linux / macOS) so the
# engine can be installed with `pip install` — no local Rust toolchain
# needed. Wheels are uploaded as downloadable artifacts on each run.

on:
  workflow_dispatch: {}        # run manually from the Actions tab
  push:
    branches:
      - claude/daegongsa-haja-9g8xn1
    paths:
      - "ggcore/**"
      - ".github/workflows/wheels.yml"

jobs:
  build:
    name: ${{ matrix.os }} (cp312)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub-hosted runners ship a Rust toolchain; maturin drives the build.
      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build release wheel
        working-directory: ggcore
        run: maturin build --release --out ../dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggcore-${{ matrix.os }}-cp312
          path: dist/*.whl
          if-no-files-found: error

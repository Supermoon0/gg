name: live site basket

on:
  workflow_dispatch:
  schedule:
    # Tuesday and Friday at 03:00 Asia/Seoul (18:00 UTC on the prior day).
    - cron: "0 18 * * 1,4"

permissions:
  contents: read

concurrency:
  group: live-site-basket
  cancel-in-progress: false

jobs:
  basket:
    name: Render live sites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      # runner.* is not a valid job-level env context (it invalidated
      # this workflow file); inject the cache dir per-run instead
      - name: Point the browser cache at the runner temp dir
        shell: bash
        run: echo "GG_BROWSER_CACHE_DIR=$RUNNER_TEMP/gg-browser-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux display and font packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk fonts-dejavu-core fonts-noto-cjk

      - name: Install CI dependencies
        run: python -m pip install --upgrade pip -r requirements-ci.txt

      - name: Build and install native wheel
        run: |
          maturin build --release --locked --manifest-path ggcore/Cargo.toml --out dist
          python -m pip install --no-index --find-links dist ggcore==0.1.0

      - name: Measure live site basket
        run: xvfb-run -a python basket_test.py | tee basket-report.txt

      - name: Upload basket report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-basket-report
          path: basket-report.txt
          if-no-files-found: warn
